controller:
#  admin:
#    username: "admin"
#    password: "MyCustomJenkinsPassword123!"
  admin:
    existingSecret: "jenkins-admin-secret"
    userKey: "jenkins-admin-user"
    passwordKey: "jenkins-admin-password"


 # Add this line to prevent the init container from hanging/failing on existing plugins
  overwritePlugins: true    

  resources:
    requests:
      cpu: 500m        # Increased from 200m so Java boots faster
      memory: 1Gi      # Increased from 512Mi
    limits:
      cpu: 1500m       # Increased from 1000m
      memory: 2.5Gi    


  initContainerResources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 1536Mi
      

  sidecars:
    configAutoReload:
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 256Mi


  # OpenShift SCC & Read-Only Root Filesystem Fixes
#  openshift:
#    enabled: true

  # ... keep your admin, resources, initContainerEnv, and route settings ...

  # Explicitly clear hardcoded UID/GID 1000 for OpenShift restricted-v2 SCC
  runAsUser: null
  fsGroup: null
  podSecurityContextOverride:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: null
    runAsGroup: null
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
        
  sidecars:
    configAutoReload:
      enabled: false
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

  initContainerEnv:
    - name: HOME
      value: /var/jenkins_home
    - name: JAVA_TOOL_OPTIONS
      value: "-Xmx1024m"      

  # OpenShift Route with HTTPS Edge Termination
  route:
    enabled: true
    host: jenkins-gitops.apps-crc.testing
    tls:
      enabled: true
      termination: edge

agent:
  podRetention: "Never"  # Options: "Never", "OnFailure", "Always", "Default"
  # Optional: If using "OnFailure" or "Always", set a timeout (in minutes) so old pods auto-delete:
  # idleMinutes: 10
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi

persistence:
  enabled: true
  storageClass: "crc-csi-hostpath-provisioner"
  size: "3Gi"

  # Give Jenkins up to 5 minutes (30 * 10s) to finish booting on CRC
  startupProbe:
    httpGet:
      path: /login
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30  