controller:
  admin:
    username: "admin"
    password: "MyCustomJenkinsPassword123!"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
      ephemeral-storage: 1Gi

  initContainerResources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 1536Mi
      ephemeral-storage: 512Mi

  sidecars:
    configAutoReload:
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 256Mi

  # OpenShift SCC & Read-Only Root Filesystem Fixes
  runAsUser: null
  fsGroup: null
  podSecurityContextOverride:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: null
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  initContainerEnv:
    - name: HOME
      value: /var/jenkins_home
    - name: JAVA_TOOL_OPTIONS
      value: "-Xmx1024m"      

  # OpenShift Route with HTTPS Edge Termination
  route:
    enabled: true
    host: jenkins-gitops.apps-crc.testing
    tls:
      enabled: true
      termination: edge

agent:
  podRetention: "Never"  # Options: "Never", "OnFailure", "Always", "Default"
  # Optional: If using "OnFailure" or "Always", set a timeout (in minutes) so old pods auto-delete:
  # idleMinutes: 10
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi

persistence:
  enabled: true
  size: "3Gi"