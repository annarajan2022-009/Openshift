controller:
  # 1. Set your custom admin username & password
  admin:
    username: "admin"
    password: "MyCustomJenkinsPassword123!"

  # 2. Minimal CPU & RAM for idle GitOps testing on CRC
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  # 3. Enable a native OpenShift Route so you can access Jenkins in your browser
  route:
    enabled: true
    host: jenkins-gitops.apps-crc.testing
    tls:
      enabled: true
      termination: edge

  # 4. OpenShift security context compatibility (null lets OpenShift assign random UIDs)
  runAsUser: null
  fsGroup: null
  overwritePlugins: true

  # 5. Fix read-only root filesystem /.cache error on OpenShift
  initContainerEnv:
    - name: HOME
      value: /var/jenkins_home
  containerEnv:
    - name: HOME
      value: /var/jenkins_home

persistence:
  # 6. Keep storage size modest for CRC
  enabled: true
  size: 3Gi

