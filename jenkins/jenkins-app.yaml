apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-jenkins
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your actual Git repository URL
    repoURL: https://github.com/annarajan2022-009/Openshift.git
    targetRevision: main
    path: jenkins
    helm:
      releaseName: my-jenkins
      valueFiles:
        - jenkins-values.yaml
  destination:
    server: https://default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
