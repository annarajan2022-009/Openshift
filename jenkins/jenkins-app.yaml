apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/annarajan2022-009/Openshift.git
    targetRevision: main
    path: jenkins/manifest
  destination:
    server: https://default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
