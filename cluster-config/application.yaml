apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-cluster-config
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com
    targetRevision: main
    path: cluster-config
  destination:
    server: https://default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
