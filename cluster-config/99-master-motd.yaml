apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-motd
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/motd
          mode: 0644
          overwrite: true
          contents:
            # Base64 encoded content of:
            # ==============================================================================
            #  AUTHORIZED ACCESS ONLY - RED HAT OPENSHIFT CONTROL PLANE (MASTER) NODE
            #  All activity on this system is logged and monitored. Unauthorized access
            #  is strictly prohibited and subject to disciplinary and legal action.
            # ==============================================================================
            source: data:text/plain;charset=utf-8;base64,
