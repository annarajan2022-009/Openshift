cat <<EOF > argocd-values.yaml
openshift:
  enabled: true

server:
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

applicationSet:
  enabled: false

notifications:
  enabled: false      


#applicationSet:
#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#   limits:
#      cpu: 200m
#      memory: 128Mi

#notifications:
#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 128Mi

dex:
  enabled: false
EOF

helm install argocd argo/argo-cd -n argocd -f argocd-values.yaml
oc expose svc/argocd-server -n argocd
