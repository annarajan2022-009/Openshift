apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.io
      chart: kube-prometheus-stack
      targetRevision: "*"
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/monitoring/values/prom-grafana-values.yaml
    - repoURL: https://github.com
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
