apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-rbac
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com
    targetRevision: main
    path: monitoring/rbac
  destination:
    server: https://default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
