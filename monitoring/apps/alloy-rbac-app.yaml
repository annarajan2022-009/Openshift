apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/annarajan2022-009/Openshift.git
    targetRevision: main
    path: monitoring/rbac
  destination:
    name: in-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
