apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/annarajan2022-009/Openshift.git
    targetRevision: main
    path: monitoring/kube-prometheus-stack
    helm:
      releaseName: prometheus-stack
      valueFiles:
        - ../custom-values.yaml
  destination:
    server: https://default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
