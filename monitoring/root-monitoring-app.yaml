apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com
    targetRevision: main
    path: monitoring/apps
  destination:
    server: https://default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
