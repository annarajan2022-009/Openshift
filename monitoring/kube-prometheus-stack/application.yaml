apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: openshift-gitops
spec:
  project: default
  sources:
    # Source 1: Official Prometheus Helm Chart
    - repoURL: https://github.io
      chart: kube-prometheus-stack
      targetRevision: 93.1.1
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/monitoring/custom-values.yaml

    # Source 2: Your GitHub Repository for values
    - repoURL: https://github.com
      targetRevision: main
      ref: values

  destination:
    server: https://default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
