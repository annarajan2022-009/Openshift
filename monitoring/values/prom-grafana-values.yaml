nodeExporter:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

prometheusOperator:
  securityContext:
    runAsNonRoot: true
    runAsUser: null
    fsGroup: null
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false
  revisionHistoryLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
      ephemeral-storage: 256Mi

prometheus:
  prometheusSpec:
    retention: 2h
    retentionSize: "900MB"
    walCompression: true
    storageSpec:
      emptyDir:
        sizeLimit: 1200Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: null
      fsGroup: null
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
        ephemeral-storage: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
        ephemeral-storage: 1200Mi

grafana:
  adminPassword: "admin"
  revisionHistoryLimit: 1
  persistence:
    enabled: false
  extraEmptyDirMounts:
    - name: grafana-storage
      mountPath: /var/lib/grafana
      sizeLimit: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    fsGroup: null
  containerSecurityContext:
    runAsUser: null
    runAsGroup: null
  initChownData:
    enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      isDefault: false
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 400m
      memory: 384Mi
      ephemeral-storage: 256Mi
  route:
    main:
      enabled: true
      host: grafana-monitoring.apps-crc.testing
      tls:
        termination: edge

alertmanager:
  alertmanagerSpec:
    retention: 2h
    storage:
      emptyDir:
        sizeLimit: 128Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: null
      fsGroup: null
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi
        ephemeral-storage: 128Mi

kube-state-metrics:
  revisionHistoryLimit: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: null
    fsGroup: null
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 128Mi
