apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: Official Prometheus Community Helm Chart
    - repoURL: https://github.io
      chart: kube-prometheus-stack
      targetRevision: 65.1.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/values.yaml
    # Source 2: Your GitHub Repo containing monitoring/values.yaml
    - repoURL: https://github.com
      targetRevision: main
      ref: values
  destination:
    server: https://default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
