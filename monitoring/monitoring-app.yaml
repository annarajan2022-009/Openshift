apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.9.0
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/monitoring/prom-grafana-values.yaml
    - repoURL: https://github.com/annarajan2022-009/Openshift.git
      targetRevision: main
      ref: values
  destination:
    server: https://default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false